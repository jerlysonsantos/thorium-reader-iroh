[package]
name = "thorium-iroh-p2p"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "thorium-iroh-p2p"
path = "src/main.rs"

[dependencies]
iroh = "0.35"
iroh-blobs = { version = "0.35", features = ["fs-store"] }
iroh-gossip = "0.35"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
bytes = "1"
futures-lite = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
